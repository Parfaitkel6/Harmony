<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmony - Audio Engine</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #121212;
      --bg-surface: #1e1e1e;
      --bg-hover: #282828;
      --primary: #1db954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --danger: #e74c3c;
      --border: #282828;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    .app-container { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 240px; background: #000; padding: 20px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid var(--border); }
    .brand { font-size: 20px; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .nav-icon { color: var(--text-sub); cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 6px; font-weight: 600; transition: all 0.2s; }
    .nav-icon.active, .nav-icon:hover { color: var(--text-main); background: var(--bg-surface); }
    
    .main-content { flex: 1; padding: 24px; overflow-y: auto; background: linear-gradient(to bottom, #222222, var(--bg-main)); }
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .auth-actions { display: flex; align-items: center; gap: 12px; }
    .user-badge { font-weight: 600; color: var(--text-main); display: none; }
    .btn { padding: 10px 20px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--text-sub); }
    
    .view-panel { display: none; }
    .view-panel.active { display: block; }
    .file-import-area { margin-bottom: 20px; }
    .upload-label { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--primary); color: #000; font-weight: bold; border-radius: 24px; cursor: pointer; }
    .hidden-input { display: none; }
    
    .playlist { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .playlist-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .playlist-item:hover { background: var(--bg-hover); }
    .track-meta { display: flex; align-items: center; gap: 12px; flex: 1; }
    .track-thumb { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: #333; }
    .playlist-item-info { display: flex; flex-direction: column; }
    .playlist-item-title { font-weight: 600; font-size: 15px; color: var(--text-main); }
    .playlist-item-artist { font-size: 13px; color: var(--text-sub); }
    
    .delete-track-btn { background: transparent; border: none; color: var(--text-sub); cursor: pointer; padding: 8px 12px; font-size: 14px; border-radius: 4px; transition: all 0.2s; }
    .delete-track-btn:hover { color: var(--danger); background: rgba(231, 76, 60, 0.1); }
    
    .player-bar { height: 90px; background: #181818; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .player-left { display: flex; align-items: center; gap: 12px; width: 25%; }
    .player-center { display: flex; flex-direction: column; align-items: center; width: 50%; gap: 8px; }
    .player-controls { display: flex; align-items: center; gap: 20px; }
    .ctrl-btn { background: transparent; border: none; color: var(--text-sub); cursor: pointer; font-size: 16px; }
    .ctrl-btn:hover { color: var(--text-main); }
    .play-btn-main { background: var(--text-main); color: #000; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 500px; font-size: 12px; color: var(--text-sub); }
    .seek-bar { flex: 1; accent-color: var(--primary); cursor: pointer; height: 4px; }
    
    .auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--bg-surface); padding: 32px; border-radius: 12px; width: 340px; display: flex; flex-direction: column; gap: 14px; position: relative; }
    .close-btn { position: absolute; top: 12px; right: 16px; background: transparent; border: none; color: var(--text-sub); font-size: 20px; cursor: pointer; }
    .modal-content input { padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: #121212; color: #fff; }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><i class="fas fa-wave-square"></i> Harmony</div>
      <ul class="nav-list">
        <li class="nav-icon active" data-target="library-view"><i class="fas fa-music"></i> Library</li>
        <li class="nav-icon" data-target="discover-view"><i class="fas fa-compass"></i> Discover</li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="file-import-area">
          <label for="audio-file-input" class="upload-label">
            <i class="fas fa-cloud-upload-alt"></i> Import Audio Tracks
          </label>
          <input type="file" id="audio-file-input" class="hidden-input" multiple accept="audio/*">
        </div>
        <div class="auth-actions">
          <span id="user-display" class="user-badge"></span>
          <button id="login-btn" class="btn btn-outline">Sign In</button>
          <button id="logout-btn" class="btn btn-outline" style="display:none;">Sign Out</button>
        </div>
      </header>

      <section id="library-view" class="view-panel active">
        <ul id="playlist" class="playlist"></ul>
      </section>

      <section id="discover-view" class="view-panel">
        <button id="featured-play-btn" class="btn btn-primary">Play Featured Track</button>
      </section>
    </main>
  </div>

  <footer class="player-bar">
    <div class="player-left">
      <div id="track-thumbnail"><div class="track-thumb"></div></div>
      <div>
        <div id="current-title" class="playlist-item-title">No Track Selected</div>
        <div id="current-artist" class="playlist-item-artist">---</div>
      </div>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button id="play-btn" class="ctrl-btn play-btn-main"><i class="fas fa-play"></i></button>
        <button id="pause-btn" class="ctrl-btn"><i class="fas fa-pause"></i></button>
      </div>
      <div class="progress-container">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-bar" class="seek-bar" value="0" min="0" max="100">
        <span id="total-duration">0:00</span>
      </div>
    </div>
    <div style="width:25%;"></div>
    <audio id="audio-element"></audio>
  </footer>

  <div id="auth-modal" class="auth-modal">
    <div class="modal-content">
      <button id="close-modal" class="close-btn">&times;</button>
      <h3>Account Access</h3>
      <input type="text" id="profile-name" placeholder="Display Name (Sign Up)">
      <input type="email" id="auth-email" placeholder="Email Address">
      <input type="password" id="auth-password" placeholder="Password">
      <button id="submit-login" class="btn btn-primary">Log In</button>
      <button id="submit-signup" class="btn btn-outline">Sign Up</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
