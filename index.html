<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmony - Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Main Player Container -->
  <div class="container">
    <div class="card">
      <h2>Harmony Player</h2>
      <p class="subtitle">Play your local audio tracks</p>

      <!-- Import Audio Button & File Input -->
      <div class="upload-section">
        <label for="audioInput" class="custom-file-upload">
          Import Music
        </label>
        <!-- Modified 'accept' attribute explicitly for iOS Safari file picker -->
        <input 
          type="file" 
          id="audioInput" 
          accept="audio/mp3, audio/wav, audio/m4a, audio/aac, .mp3, .wav, .m4a, .aac" 
          multiple 
        />
      </div>

      <!-- Player UI -->
      <div class="player-controls">
        <p id="nowPlaying">No track loaded</p>
        <audio id="audioPlayer" controls></audio>
      </div>

      <!-- Actions -->
      <div class="actions">
        <a href="#" id="forgotPasswordLink">Forgot password?</a>
      </div>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div id="resetModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeResetModal">&times;</span>
      <h3>Reset Password</h3>
      <p class="modal-sub">Enter your account email to receive a recovery link.</p>
      
      <form id="resetForm">
        <div class="input-group">
          <input type="email" id="resetEmail" placeholder="name@example.com" required />
        </div>
        <button type="submit" class="primary-btn">Send Reset Link</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
