<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmony - Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2>Harmony</h2>
            <ul>
                <li class="active">Home</li>
                <li>Search</li>
                <li>Your Library</li>
            </ul>
        </aside>

        <!-- Main Content Section -->
        <main class="main-content">
            <header>
                <div id="auth-section">
                    <button id="login-btn">Login / Sign Up</button>
                    <span id="user-display" style="display: none;"></span>
                    <button id="logout-btn" style="display: none;">Logout</button>
                </div>
            </header>
            
            <section class="hero">
                <h1>Welcome to Harmony</h1>
                <p>Play and manage your favorite tracks</p>
                <div class="upload-container">
                    <label for="audio-file-input" class="upload-label">Upload Music (.mp3)</label>
                    <input type="file" id="audio-file-input" accept="audio/*" multiple style="display: none;">
                </div>
            </section>

            <section class="playlist-section">
                <h2>Your Playlist</h2>
                <ul id="playlist">
                    <!-- Dynamic tracks will appear here -->
                </ul>
            </section>
        </main>
    </div>

    <!-- Persistent Music Player Bar -->
    <footer class="player-bar">
        <div class="track-info">
            <span id="current-title">No track selected</span>
        </div>
        <div class="player-controls">
            <button id="play-btn">Play</button>
            <button id="pause-btn">Pause</button>
        </div>
        <audio id="audio-element"></audio>
    </footer>

    <!-- Auth Modal with Profile Name Support -->
    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="close-modal">&times;</span>
            <h3>Authentication</h3>
            <input type="text" id="profile-name" placeholder="Profile Name (Optional for Signup)">
            <input type="email" id="auth-email" placeholder="Email">
            <input type="password" id="auth-password" placeholder="Password">
            <button id="submit-signup">Sign Up</button>
            <button id="submit-login">Log In</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
